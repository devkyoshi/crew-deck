name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MONGODB_URI: mongodb://localhost:27017/?directConnection=true
  MONGODB_DB: crewdeck
  REDIS_URL: redis://localhost:6379

jobs:
  check:
    name: Lint, types, unit and API tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval \"try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}\""
          --health-interval 3s --health-timeout 10s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval \"try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}\""
          --health-interval 3s --health-timeout 10s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CI: 'true'
      # The suite signs in many times a minute; the production default (10) would rate limit it.
      AUTH_RATE_LIMIT_MAX: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Environment file for the dev servers
        run: cp .env.example .env
      - name: Migrate and seed (base tenants plus demo workspace)
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed:demo
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # A small run of the realtime load test (docs/messaging/LOAD-TEST.md): it starts its own gateway and
      # fails the build on lost, duplicated or cross-workspace deliveries, or slow delivery.
      - name: Realtime load smoke test
        env:
          TENANTS: '3'
          USERS: '120'
          SECONDS: '10'
        run: pnpm --filter @crew-deck/api load:realtime
      # Playwright starts the API and web dev servers itself (see playwright.config.ts).
      - name: Run end-to-end tests
        run: pnpm exec playwright test
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
