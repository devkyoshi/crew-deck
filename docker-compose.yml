services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crew_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crew_admin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-crewdeck}
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:-crew_app_dev}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crew_admin} -d ${POSTGRES_DB:-crewdeck}']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # Full containerised stack: `docker compose --profile full up --build`
  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://crew_app:${APP_ROLE_PASSWORD:-crew_app_dev}@postgres:5432/${POSTGRES_DB:-crewdeck}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      LOG_LEVEL: info
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TENANT_ORIGIN_TEMPLATE: ${TENANT_ORIGIN_TEMPLATE:-http://{slug}.localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - '4000:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
