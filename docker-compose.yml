services:
  # Single-node replica set: MongoDB transactions require one. Connect with directConnection=true.
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '${MONGO_PORT:-27018}:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 3s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # Full containerised stack: `docker compose --profile full up --build`
  api:
    profiles: [full]
    image: crew-deck-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      MONGODB_DB: ${MONGODB_DB:-crewdeck}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      LOG_LEVEL: info
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TENANT_ORIGIN_TEMPLATE: ${TENANT_ORIGIN_TEMPLATE:-http://{slug}.localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Crew Deck}
    ports:
      - '4000:4000'
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off: creates the MongoDB indexes. Idempotent and safe to run on every deploy.
  migrate:
    profiles: [full, tools]
    image: crew-deck-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node_modules/.bin/tsx', 'src/db/migrate.ts']
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      MONGODB_DB: ${MONGODB_DB:-crewdeck}
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'

  # One-off, development only: base tenants plus the demo workspace content. Run with
  #   docker compose --profile tools run --rm seed
  # NODE_ENV=development is required: in production mode the seed adds no passwords or demo people.
  seed:
    profiles: [tools]
    image: crew-deck-api
    command:
      [
        'sh',
        '-c',
        'node_modules/.bin/tsx src/db/seed.ts && node_modules/.bin/tsx src/db/seed-demo.ts',
      ]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      MONGODB_DB: ${MONGODB_DB:-crewdeck}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongodata:
  redisdata:
